function linesOf(g){const raw=g.lines;if(Array.isArray(raw))return raw.slice(0,4);if(raw&&typeof raw==='object')return Object.keys(raw).sort().map(k=>raw[k]).slice(0,4);return []}

function lockClock(ms){let s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;const p=n=>String(n).padStart(2,'0');return h>0?h+':'+p(m)+':'+p(s):p(m)+':'+p(s)}
function statusText(){const lines=linesOf(GROUP);const line=lines[Math.min(TAB,Math.max(0,lines.length-1))]||null;if(line&&String(line.status||'').toLowerCase()==='settled')return 'FINAL';const tee=Date.parse(GROUP.teeTime||'');const teeMs=+GROUP.teeTimeMs;const past=(Number.isFinite(teeMs)&&Date.now()>=teeMs)||(Number.isFinite(tee)&&Date.now()>=tee);if(!Number.isFinite(tee)&&!Number.isFinite(teeMs))return 'TEE TIME TBD';if(past)return 'LOCKED';const left=(Number.isFinite(tee)?tee:teeMs)-Date.now();return 'LIVE · LOCKS IN '+lockClock(left)}
function tabLabel(line){const t=String(line.title||'Market');if(/low net/i.test(t))return 'Low net';if(/best gross/i.test(t))return 'Best gross';if(/head to head/i.test(t))return 'Head to head';const net=t.match(/^(.+?)\s+net score$/i);if(net)return net[1].split(',')[0];return t.length>22?t.slice(0,20)+'…':t}

function seriesFor(lineIndex,side,openCents){const base=Date.parse(GROUP&&GROUP.teeTime)||Date.now();const pts=[{t:base-3600000,c:openCents}];const node=PRICES[String(lineIndex)]||{};const openNode=node.open&&node.open[side];if(openNode&&Number.isFinite(+openNode.c))pts[0]={t:+openNode.t||pts[0].t,c:+openNode.c};const trades=node.trades||{};Object.keys(trades).forEach(k=>{const p=trades[k];if(p&&p.side===side&&Number.isFinite(+p.c))pts.push({t:+p.t||base,c:+p.c})});pts.sort((a,b)=>a.t-b.t);const now=Date.now();const past=pts.filter(p=>p.t<=now);const current=past.length?past[past.length-1].c:(pts.length?pts[pts.length-1].c:openCents);const out=past.length?past.slice():[{t:now-3600000,c:current}];if(out[out.length-1].t<now)out.push({t:now,c:out[out.length-1].c});if(out.length<2)out.push({t:out[0].t+60000,c:out[0].c});return out}
function clipSeries(pts,range){if(range==='all'||pts.length<2)return pts;const end=pts[pts.length-1].t;const cut=end-(range==='live'?3600000:86400000);const kept=pts.filter(p=>p.t>=cut);const prev=[...pts].reverse().find(p=>p.t<cut);if(prev)kept.unshift({t:cut,c:prev.c});if(!kept.length)return pts.slice(-1);if(kept.length===1)kept.push({t:end,c:kept[0].c});return kept}
function volumeFor(i){let n=0;Object.keys(ACTIVITY).forEach(k=>{const a=ACTIVITY[k];if(a&&String(a.line)===String(i))n+=Math.floor(+a.a||0)});return n}
function layoutEnds(items){const rows=items.map(it=>({...it}));rows.sort((a,b)=>a.y-b.y);const gap=8;for(let i=1;i<rows.length;i++)if(rows[i].y<rows[i-1].y+gap)rows[i].y=rows[i-1].y+gap;if(rows.length&&rows[rows.length-1].y>96){const shift=rows[rows.length-1].y-96;rows.forEach(r=>{r.y-=shift})}for(let i=rows.length-2;i>=0;i--)if(rows[i].y>rows[i+1].y-gap)rows[i].y=rows[i+1].y-gap;if(rows.length&&rows[0].y<4){const shift=4-rows[0].y;rows.forEach(r=>{r.y+=shift})}return rows}
function axisTicks(lo,hi){const span=hi-lo;const step=span>50?25:span>24?10:span>12?5:span>6?2:1;const out=[];for(let v=Math.ceil((lo+span*0.04)/step)*step;v<hi-span*0.04;v+=step)out.push(v);return out.slice(0,4)}
function chartHTML(lineIndex,sides){const series=sides.map((s,idx)=>({color:COLORS[idx%COLORS.length],name:shortName(s.label),pct:s.cents,points:clipSeries(seriesFor(lineIndex,s.id,s.cents),RANGE)}));let minT=Infinity,maxT=-Infinity,minC=100,maxC=0;series.forEach(s=>{minC=Math.min(minC,s.pct);maxC=Math.max(maxC,s.pct);s.points.forEach(p=>{if(p.t<minT)minT=p.t;if(p.t>maxT)maxT=p.t;if(p.c<minC)minC=p.c;if(p.c>maxC)maxC=p.c})});if(!Number.isFinite(minT))return '';if(minT===maxT)maxT=minT+1;const pad=Math.max(2,(maxC-minC)*0.22);let lo=Math.max(0,minC-pad),hi=Math.min(100,maxC+pad);if(hi-lo<8){const mid=(minC+maxC)/2;lo=Math.max(0,mid-4);hi=Math.min(100,lo+8)}const x=t=>((t-minT)/(maxT-minT))*100;const y=c=>((hi-c)/(hi-lo))*100;const paths=series.map(s=>'<path d="'+s.points.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(2)+' '+Math.max(0,Math.min(100,y(p.c))).toFixed(2)).join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>').join('');const grids=(axisTicks(lo,hi).length?axisTicks(lo,hi):[lo+(hi-lo)/2]).map(v=>'<i style="top:'+Math.max(0,Math.min(100,y(v))).toFixed(2)+'%"></i>').join('');const labels=layoutEnds(series.map(s=>({color:s.color,name:s.name,pct:s.pct,y:Math.max(0,Math.min(100,y(s.pct)))}))).map(e=>'<div class="kend" style="top:'+e.y.toFixed(2)+'%;color:'+e.color+'"><span>'+esc(e.name)+'</span><b>'+Math.round(e.pct)+'%</b></div>').join('');return '<div class="kchart"><div class="kplot"><div class="kgrid">'+grids+'</div><svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Price history">'+paths+'</svg></div><div class="kends">'+labels+'</div></div>'}
function chipOn(v,balN){if(v==='max')return balN!=null&&AMT===balN&&AMT>0&&AMT!==5&&AMT!==10&&AMT!==25;return AMT===+v}
function slipHTML(line,s,i){const clockOpen=TG.lineOpen(GROUP,line),open=!!(clockOpen&&rulesReady(GROUP)),pay=TG.payoutFor(AMT,s.cents),balN=ACCT?Math.floor(+ACCT.bal||0):null,can=!!(USER&&MEMBER&&ACCT&&open&&AMT>=1&&balN!=null&&AMT<=balN);const lockMsg=open?'':(clockOpen?'Bets stay closed until this group includes a future teeTimeMs.':'This line is locked at tee time.');const note=NOTE&&NOTE.line===i&&NOTE.side===s.id?'<p class="'+(NOTE.ok?'oknote':'err')+'">'+esc(NOTE.text)+'</p>':'';const chip=(v,label)=>'<button type="button" data-amt="'+v+'"'+(chipOn(v,balN)?' class="on"':'')+'>'+label+'</button>';const odds=s.odds==null||s.odds===''?'':' · '+esc(s.odds);return '<div class="slip" id="slip"><p class="kicker">Play money · no cash value</p><p class="slip-price"><b>'+esc(s.label)+'</b> at '+s.cents+'¢'+odds+'</p><p class="muted">Balance '+(balN==null?'— sign in for 100 tokens':'<b>'+balN+'</b> tokens')+'</p><label>Amount in Torii tokens<input id="amt" type="number" min="1" step="1" inputmode="numeric" value="'+esc(AMT)+'" '+(open?'':'disabled')+'></label><div class="chips">'+chip('5','5')+chip('10','10')+chip('25','25')+chip('max','Max')+'</div><p class="pay">Potential payout '+pay+' tokens</p>'+(lockMsg?'<p class="locknote">'+esc(lockMsg)+'</p>':'')+note+'<div class="slip-actions"><button class="place" id="place" '+(can?'':'disabled')+'>Place bet</button><button type="button" class="cancel" id="slip-cancel">Cancel</button></div></div>'}
function draw(){if(!GROUP)return;const lines=linesOf(GROUP);if(!lines.length){B.innerHTML='<p class="muted">No markets on this tee time.</p>';return}if(TAB>=lines.length)TAB=0;if(TAB<0)TAB=0;const line=lines[TAB];const sides=TG.marketSides(line);const clock=teeClock(GROUP.teeTime);document.title=(line.title||'Market')+' · Torii Golf Prediction Platform';const bal=ACCT?Math.floor(+ACCT.bal||0):null;const tabs=lines.length<2?'':'<div class="mtabs" role="tablist">'+lines.map((ln,i)=>'<button type="button" role="tab" data-tab="'+i+'"'+(i===TAB?' class="on" aria-selected="true"':' aria-selected="false"')+'>'+esc(tabLabel(ln))+'</button>').join('')+'</div>';const ranges=['live','1d','all'].map(r=>'<button type="button" data-range="'+r+'"'+(RANGE===r?' class="on"':'')+'>'+(r==='live'?'Live':r==='1d'?'1D':'All')+'</button>').join('');const list=sides.map((s,idx)=>{const sel=SEL.line===TAB&&SEL.side===s.id;const color=COLORS[idx%COLORS.length];const hcp=hcpText(s.label);return '<div class="opt"><div class="orow"><div class="who"><b>'+esc(s.label)+'</b>'+(hcp?'<span>'+esc(hcp)+'</span>':'')+'</div><div class="opct" style="color:'+color+'">'+s.cents+'%</div><button type="button" class="yesbtn'+(sel?' sel':'')+'" data-line="'+TAB+'" data-side="'+esc(s.id)+'">Yes '+s.cents+'¢</button></div>'+(sel?slipHTML(line,s,TAB):'')+'</div>'}).join('');const mine=Object.keys(MY).map(id=>MY[id]).filter(b=>b&&b.gid===GID&&b.date===DATE).sort((a,b)=>b.t-a.t);const act=Object.keys(ACTIVITY).map(id=>ACTIVITY[id]).filter(Boolean).sort((a,b)=>(b.t||0)-(a.t||0)).slice(0,20);const tracker='<section class="tracker"><p class="balnote">'+(bal==null?'Sign in to receive 100 Torii tokens. Play money, no cash value.':bal+' tokens · play money, no cash value')+(USER?' · <a href="#" id="so">Sign out</a>':'')+'</p><h2>Your bets</h2>'+(mine.length?mine.map(b=>'<div class="rowline"><span>'+esc(b.title||'Line')+' · '+esc(b.label||b.side)+' · '+esc(b.st)+'</span><b>'+esc(b.a)+' tokens</b></div>').join(''):'<p class="muted">You have no bets on this tee time.</p>')+'<h2>Recent activity</h2><p class="muted">Display names only. Balances and accounts stay private.</p>'+(act.length?act.map(a=>'<div class="rowline"><span>'+esc(a.n)+' · '+esc(a.title||'')+' · '+esc(a.label||a.side)+'</span><b>'+esc(a.a)+' tokens</b></div>').join(''):'<p class="muted">No play-money bets in this group yet.</p>')+'</section>';B.innerHTML='<section class="hero"><small class="keye">Colonial CC'+(clock?' · Tee '+esc(clock):'')+'</small><p class="kstatus"><i></i><span id="livephase">'+esc(statusText())+'</span></p><h1>'+esc(line.title||'Market')+'</h1><p>Play money. No cash value. A tap opens the bet under that side.</p></section><p class="sync">Live board · prices from the opening line and member trades</p>'+tabs+chartHTML(TAB,sides)+'<div class="kmeta"><span class="vol">'+volumeFor(TAB).toLocaleString('en-US')+' tokens</span><div class="ranges">'+ranges+'</div></div><div class="olist">'+list+'</div>'+tracker;
B.querySelectorAll('.yesbtn').forEach(btn=>btn.onclick=()=>{const lineN=+btn.dataset.line,side=btn.dataset.side;if(SEL.line===lineN&&SEL.side===side){SEL={line:-1,side:''};NOTE=null}else{SEL={line:lineN,side};NOTE=null}draw();const slip=document.getElementById('slip');if(slip)slip.scrollIntoView({block:'nearest'})});

const amt=document.getElementById('amt');if(amt)amt.oninput=()=>{AMT=Math.floor(+amt.value||0);const p=document.querySelector('#slip .pay');const lineNow=linesOf(GROUP)[SEL.line];const s=TG.marketSides(lineNow||{}).find(x=>x.id===SEL.side);if(p&&s)p.textContent='Potential payout '+TG.payoutFor(AMT,s.cents)+' tokens';const place=document.getElementById('place');const balN=ACCT?Math.floor(+ACCT.bal||0):null;if(place)place.disabled=!(USER&&MEMBER&&ACCT&&lineNow&&TG.lineOpen(GROUP,lineNow)&&rulesReady(GROUP)&&s&&AMT>=1&&balN!=null&&AMT<=balN);if(NOTE&&!NOTE.ok)NOTE=null;B.querySelectorAll('[data-amt]').forEach(c=>c.classList.toggle('on',chipOn(c.dataset.amt,balN)))};
B.querySelectorAll('[data-amt]').forEach(b=>b.onclick=()=>{if(b.dataset.amt==='max')AMT=Math.max(0,Math.floor(+(ACCT&&ACCT.bal)||0));else AMT=+b.dataset.amt;if(NOTE&&!NOTE.ok)NOTE=null;draw();const slip=document.getElementById('slip');if(slip)slip.scrollIntoView({block:'nearest'})});
const place=document.getElementById('place');if(place)place.onclick=placeBet;
const cancel=document.getElementById('slip-cancel');if(cancel)cancel.onclick=()=>{SEL={line:-1,side:''};NOTE=null;draw()};

async function placeBet(){const lines=linesOf(GROUP);const line=lines[SEL.line];const side=TG.marketSides(line||{}).find(s=>s.id===SEL.side);const fail=text=>{NOTE={ok:false,line:SEL.line,side:SEL.side,text};draw()};if(!USER||!MEMBER||!ACCT||!line||!side)return fail('Sign in as a club member to use play-money tokens.');if(!TG.lineOpen(GROUP,line))return fail('This line is locked at tee time.');if(!(AMT>=1)||AMT>Math.floor(+ACCT.bal||0))return fail('Amount must be at least 1 and within your token balance.');if(!Number.isFinite(+GROUP.teeTimeMs)||!(+GROUP.teeTimeMs>Date.now()))return fail('Bets stay closed until this group has a future teeTimeMs.');const built=TG.buildBetUpdate({uid:USER.uid,name:ACCT.n,bal:Math.floor(+ACCT.bal),club:CLUB,date:DATE,gid:GID,line:String(SEL.line),side:side.id,label:side.label,amount:AMT,price:side.cents,title:line.title||'Market'});try{await D.ref().update(built.updates);NOTE={ok:true,line:SEL.line,side:side.id,text:'Bet placed. '+AMT+' play-money tokens set aside.'};draw()}catch(e){fail('Bet was rejected. The line may be locked, or the balance was not enough.')}}
async function seedOpen(){if(!USER||!MEMBER||!GROUP)return;const lines=linesOf(GROUP);for(let i=0;i<lines.length;i++){const sides=TG.marketSides(lines[i]);for(const s of sides){const ref=D.ref('golf_prices/'+CLUB+'/'+DATE+'/'+GID+'/'+i+'/open/'+s.id);try{const cur=await ref.once('value');if(!cur.exists())await ref.set({c:s.cents,t:Date.parse(GROUP.teeTime)||Date.now(),src:'open',side:s.id})}catch(e){}}}}
function listen(){if(!USER)return;D.ref('golf_accounts/'+USER.uid).on('value',s=>{ACCT=s.val();draw()});D.ref('golf_mybets/'+USER.uid).on('value',s=>{MY=s.val()||{};draw()});if(!MEMBER)return;D.ref('golf_prices/'+CLUB+'/'+DATE+'/'+GID).on('value',s=>{PRICES=s.val()||{};draw()});D.ref('golf_activity/'+CLUB+'/'+DATE+'/'+GID).on('value',s=>{ACTIVITY=s.val()||{};draw()})}
async function loadGroup(){if(!DATE||!GID){G.style.display='';G.innerHTML='<h2>Missing tee time</h2><p class="muted"><a href="./">Back to the tee sheet</a></p>';return}try{ACCT=await ensureAccount(USER)}catch(e){ACCT=null}let snap;try{snap=await D.ref('golf/'+CLUB+'/sheets/'+DATE+'/groups/'+GID).once('value')}catch(x){return clubForm()}if(!snap.exists()){G.style.display='';G.innerHTML='<h2>Group not found</h2><p class="muted"><a href="./">Back to the tee sheet</a></p>';return}MEMBER=true;GROUP=snap.val();G.style.display='none';listen();draw();seedOpen()}
