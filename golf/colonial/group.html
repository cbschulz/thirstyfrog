<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tee time market · Torii Golf Prediction Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../club.css">
</head><body>
<header class="mast"><div class="wrap mast-in"><a class="brand" href="/"><svg class="gate" viewBox="0 0 100 86" role="img" aria-label="Torii gate"><path fill="currentColor" d="M2 6 Q50 14 98 6 L96 15 Q50 21 4 15Z"/><rect fill="currentColor" x="10" y="19" width="80" height="6"/><rect fill="currentColor" x="46" y="25" width="8" height="11"/><rect fill="currentColor" x="13" y="31" width="74" height="6"/><path fill="currentColor" d="M22 19h9l2 61h-13z"/><path fill="currentColor" d="M69 19h9l2 61h-13z"/><rect fill="currentColor" x="17" y="78" width="19" height="6"/><rect fill="currentColor" x="64" y="78" width="19" height="6"/></svg><span class="wm"><strong>Torii</strong><em>Golf Prediction Platform</em></span></a><a class="toplink" href="./">Tee sheet</a></div></header>
<main class="page"><div class="wrap">
<p class="crumb"><a href="./">Colonial</a> <span id="crumbWhen">· Tee time</span></p>
<div class="card" id="gate">Loading…</div>
<div id="board"></div>
</div></main>
<script src="../market.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const CLUB='colonial';
const qs=new URLSearchParams(location.search);
const DATE=qs.get('date')||'';
const GID=qs.get('g')||'';
firebase.initializeApp({apiKey:'AIzaSyALDF-z2uZONruRz2EXbJAfWKHnW4FS5qA',authDomain:'thirstyfrog-e2aed.firebaseapp.com',databaseURL:'https://thirstyfrog-e2aed-default-rtdb.firebaseio.com',projectId:'thirstyfrog-e2aed',appId:'1:656084503103:web:aca5e6473fd2b920ec868a'});
const A=firebase.auth(),D=firebase.database(),G=document.getElementById('gate'),B=document.getElementById('board');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TG=window.ToriiGolf;
let USER=null,ACCT=null,GROUP=null,MEMBER=false;
let PRICES={},ACTIVITY={},MY={},SEL={line:0,side:''},AMT=10;
function signInForm(){G.style.display='';G.innerHTML='<p class="kicker">Members</p><h2>Sign in with your Torii account</h2><p class="muted">Same login as the Torii hub. First sign-in on golf grants 100 Torii tokens ($100 play money, no cash value), once per account.</p><label>Email<input id="em" type="email" placeholder="Email" autocomplete="email"></label><label>Password<input id="pw" type="password" placeholder="Torii password" autocomplete="current-password"></label><button onclick="si()">Sign in</button><p id="m" class="err"></p>';}
async function si(){try{await A.signInWithEmailAndPassword(document.getElementById('em').value.trim(),document.getElementById('pw').value)}catch(x){document.getElementById('m').textContent='Sign-in failed. Check your email and password.'}}
function clubForm(){G.style.display='';G.innerHTML='<p class="kicker">Members</p><h2>Colonial members password</h2><p class="muted">Enter the club password once. It unlocks this board for your account.</p><label>Club password<input id="cp" type="password" placeholder="Club password" autocomplete="off"></label><div class="actions"><button onclick="unlock()">Unlock</button><a href="#" onclick="A.signOut();return false">Sign out</a></div><p id="m" class="err"></p>';}
async function unlock(){const v=document.getElementById('cp').value.trim();try{await D.ref('golf_members/'+CLUB+'/'+A.currentUser.uid).set(v);loadGroup()}catch(x){document.getElementById('m').textContent='Wrong club password.'}}
async function displayName(user){let n=user.displayName||'';try{const u=await D.ref('users/'+user.uid).once('value');if(u.exists()&&u.val().first)n=(u.val().first+' '+(u.val().last||'')).trim()}catch(e){}if(!n)n='Member';return n.slice(0,40)}
async function ensureAccount(user){const ref=D.ref('golf_accounts/'+user.uid);const snap=await ref.once('value');if(snap.exists())return snap.val();const acct={bal:100,granted:true,n:await displayName(user),createdAt:Date.now()};await ref.set(acct);return acct}
function fmtTee(iso){const t=Date.parse(iso);if(!Number.isFinite(t))return String(iso||'');return new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date(t))}
function linesOf(g){const raw=g.lines;if(Array.isArray(raw))return raw.slice(0,4);if(raw&&typeof raw==='object')return Object.keys(raw).sort().map(k=>raw[k]).slice(0,4);return []}
function sideLabel(line,id){const s=TG.marketSides(line).find(x=>x.id===id);return s?s.label:id}
function rulesReady(group){const ms=+group.teeTimeMs;return Number.isFinite(ms)&&ms>Date.now()}
function seriesFor(lineIndex,side,openCents){const base=Date.parse(GROUP&&GROUP.teeTime)||Date.now();const pts=[{t:base-3600000,c:openCents}];const node=PRICES[String(lineIndex)]||{};const openNode=node.open&&node.open[side];if(openNode&&Number.isFinite(+openNode.c))pts[0]={t:+openNode.t||pts[0].t,c:+openNode.c};const trades=node.trades||{};Object.keys(trades).forEach(k=>{const p=trades[k];if(p&&p.side===side&&Number.isFinite(+p.c))pts.push({t:+p.t||base,c:+p.c})});pts.sort((a,b)=>a.t-b.t);return pts}
function draw(){if(!GROUP)return;const lines=linesOf(GROUP);const when=fmtTee(GROUP.teeTime);document.getElementById('crumbWhen').textContent='· '+when;document.title=when+' · Torii Golf Prediction Platform';const tee=Date.parse(GROUP.teeTime);const past=Number.isFinite(tee)&&Date.now()>=tee;const settled=lines.length&&lines.every(l=>String(l.status||'').toLowerCase()==='settled');const phase=settled?'Final':past?'On course':(Number.isFinite(tee)?'Tee off in '+count(tee-Date.now()):'Tee time TBD');const bal=ACCT?Math.floor(+ACCT.bal||0):null;const players=(GROUP.players||[]).map(p=>'<span>'+esc(p.name)+' · Index '+esc(p.handicapIndex==null?'—':p.handicapIndex)+'</span>').join('');
const toneOf=s=>s.id==='under'||s.id==='o1'?'no':s.id==='o2'?'gold':s.id==='o3'?'teal':'yes';
let markets='';lines.forEach((line,i)=>{const sides=TG.marketSides(line);const openLine=TG.lineOpen(GROUP,line);if(!SEL.side&&sides[0]){SEL.line=i;SEL.side=sides[0].id}const chosen=SEL.line===i?SEL.side:(sides[0]&&sides[0].id);const cur=sides.find(s=>s.id===chosen)||sides[0];markets+='<article class="mkt"><h2>'+esc(line.title||'Market')+'</h2><div class="contracts">'+sides.map(s=>{const tone=toneOf(s);return '<button type="button" class="contract tone-'+tone+(SEL.line===i&&SEL.side===s.id?' sel':'')+'" data-line="'+i+'" data-side="'+esc(s.id)+'"><span class="yes">'+(s.id==='under'?'No':'Yes')+'</span><b>'+s.cents+'¢</b><small>'+esc(s.label)+' · '+esc(s.odds)+'</small></button>'}).join('')+'</div>'+(cur?TG.sparkline(seriesFor(i,cur.id,cur.cents),toneOf(cur)):'')+'<p class="chartcap">'+(openLine?'Opening price, then play-money trades':'Locked')+' · no cash value</p></article>'});
const line=lines[SEL.line]||lines[0];const sides=line?TG.marketSides(line):[];const side=sides.find(s=>s.id===SEL.side)||sides[0];const clockOpen=!!(line&&TG.lineOpen(GROUP,line));const open=!!(clockOpen&&rulesReady(GROUP));const pay=side?TG.payoutFor(AMT,side.cents):0;const can=!!(USER&&MEMBER&&ACCT&&open&&side&&AMT>=1&&AMT<=Math.floor(+ACCT.bal||0));const lockMsg=!line||open?'':(clockOpen?'Bets stay closed until this group includes a future teeTimeMs.':'This line is locked at tee time.');
const ticket='<aside class="ticket"><p class="kicker">Play money</p><h2>Bet ticket</h2><p>'+(side?esc(line.title)+' · '+esc(side.label)+' at <b>'+side.cents+'¢</b>':'Pick a contract')+'</p><label>Amount in Torii tokens<input id="amt" type="number" min="1" step="1" value="'+esc(AMT)+'" '+(open?'':'disabled')+'></label><div class="chips"><button type="button" data-amt="5">5</button><button type="button" data-amt="10">10</button><button type="button" data-amt="25">25</button></div><p class="pay">Potential payout '+pay+' tokens</p><p class="muted">If this side wins, the return is stake × 100 ÷ price, in tokens. Torii tokens are play money and have no cash value.</p>'+(lockMsg?'<p class="locknote">'+esc(lockMsg)+'</p>':'')+'<button class="place" id="place" '+(can?'':'disabled')+'>Place play-money bet</button><p id="betmsg" class="err"></p></aside>';
const mine=Object.keys(MY).map(id=>MY[id]).filter(b=>b&&b.gid===GID&&b.date===DATE).sort((a,b)=>b.t-a.t);
const act=Object.keys(ACTIVITY).map(id=>ACTIVITY[id]).filter(Boolean).sort((a,b)=>(b.t||0)-(a.t||0)).slice(0,20);
B.innerHTML='<p class="eyebrow">Colonial Country Club</p><h1>'+esc(when)+'</h1><div class="rule"></div><p class="lede"><span id="livephase" class="livepill '+(settled?'final':past?'locked':'open')+'">'+esc(phase)+'</span> · '+(GROUP.tee?esc(GROUP.tee)+' tee · ':'')+(bal==null?'Sign in to receive 100 Torii tokens ($100 play money, no cash value).':bal+' Torii tokens · $100 play money on first sign-in, no cash value')+(USER?' · <a href="#" id="so">Sign out</a>':'')+'</p><div class="players">'+players+'</div><div class="layout"><div>'+markets+'</div>'+ticket+'</div><section class="tracker"><h2>Your bets</h2>'+(mine.length?mine.map(b=>'<div class="rowline"><span>'+esc(b.title||'Line')+' · '+esc(b.label||b.side)+' · '+esc(b.st)+'</span><b>'+esc(b.a)+' tokens</b></div>').join(''):'<p class="muted">You have no bets on this tee time.</p>')+'<h2>Recent activity</h2><p class="muted">Display names only. Balances and accounts stay private.</p>'+(act.length?act.map(a=>'<div class="rowline"><span>'+esc(a.n)+' · '+esc(a.title||'')+' · '+esc(a.label||a.side)+'</span><b>'+esc(a.a)+' tokens</b></div>').join(''):'<p class="muted">No play-money bets in this group yet.</p>')+'</section>';
B.querySelectorAll('.contract').forEach(btn=>btn.onclick=()=>{SEL.line=+btn.dataset.line;SEL.side=btn.dataset.side;draw()});
const amt=document.getElementById('amt');if(amt)amt.oninput=()=>{AMT=Math.floor(+amt.value||0);const p=document.querySelector('.pay');const lineNow=linesOf(GROUP)[SEL.line];const s=TG.marketSides(lineNow||{}).find(x=>x.id===SEL.side);if(p&&s)p.textContent='Potential payout '+TG.payoutFor(AMT,s.cents)+' tokens';const place=document.getElementById('place');if(place)place.disabled=!(USER&&MEMBER&&ACCT&&lineNow&&TG.lineOpen(GROUP,lineNow)&&rulesReady(GROUP)&&s&&AMT>=1&&AMT<=Math.floor(+ACCT.bal||0))};
B.querySelectorAll('[data-amt]').forEach(b=>b.onclick=()=>{AMT=+b.dataset.amt;draw()});
const place=document.getElementById('place');if(place)place.onclick=placeBet;
const so=document.getElementById('so');if(so)so.onclick=e=>{e.preventDefault();A.signOut()};
}
function count(ms){let s=Math.max(0,Math.floor(ms/1000));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;const p=n=>String(n).padStart(2,'0');return d+'d '+p(h)+'h '+p(m)+'m '+p(s)+'s'}
async function placeBet(){const msg=document.getElementById('betmsg');const lines=linesOf(GROUP);const line=lines[SEL.line];const side=TG.marketSides(line||{}).find(s=>s.id===SEL.side);if(!USER||!MEMBER||!ACCT||!line||!side){if(msg)msg.textContent='Sign in as a club member to use play-money tokens.';return}if(!TG.lineOpen(GROUP,line)){if(msg)msg.textContent='This line is locked at tee time.';return}if(!(AMT>=1)||AMT>Math.floor(+ACCT.bal||0)){if(msg)msg.textContent='Amount must be at least 1 and within your token balance.';return}if(!Number.isFinite(+GROUP.teeTimeMs)||!(+GROUP.teeTimeMs>Date.now())){if(msg)msg.textContent='Bets stay closed until this group has a future teeTimeMs.';return}const built=TG.buildBetUpdate({uid:USER.uid,name:ACCT.n,bal:Math.floor(+ACCT.bal),club:CLUB,date:DATE,gid:GID,line:String(SEL.line),side:side.id,label:side.label,amount:AMT,price:side.cents,title:line.title||'Market'});try{await D.ref().update(built.updates);if(msg)msg.textContent='Bet recorded. '+AMT+' tokens set aside.'}catch(e){if(msg)msg.textContent='Bet was rejected. The line may be locked, or the balance was not enough.'}}
async function seedOpen(){if(!USER||!MEMBER||!GROUP)return;const lines=linesOf(GROUP);for(let i=0;i<lines.length;i++){const sides=TG.marketSides(lines[i]);for(const s of sides){const ref=D.ref('golf_prices/'+CLUB+'/'+DATE+'/'+GID+'/'+i+'/open/'+s.id);try{const cur=await ref.once('value');if(!cur.exists())await ref.set({c:s.cents,t:Date.parse(GROUP.teeTime)||Date.now(),src:'open',side:s.id})}catch(e){}}}}
function listen(){if(!USER)return;D.ref('golf_accounts/'+USER.uid).on('value',s=>{ACCT=s.val();draw()});D.ref('golf_mybets/'+USER.uid).on('value',s=>{MY=s.val()||{};draw()});if(!MEMBER)return;D.ref('golf_prices/'+CLUB+'/'+DATE+'/'+GID).on('value',s=>{PRICES=s.val()||{};draw()});D.ref('golf_activity/'+CLUB+'/'+DATE+'/'+GID).on('value',s=>{ACTIVITY=s.val()||{};draw()})}
async function loadGroup(){if(!DATE||!GID){G.style.display='';G.innerHTML='<h2>Missing tee time</h2><p class="muted"><a href="./">Back to the tee sheet</a></p>';return}try{ACCT=await ensureAccount(USER)}catch(e){ACCT=null}let snap;try{snap=await D.ref('golf/'+CLUB+'/sheets/'+DATE+'/groups/'+GID).once('value')}catch(x){return clubForm()}if(!snap.exists()){G.style.display='';G.innerHTML='<h2>Group not found</h2><p class="muted"><a href="./">Back to the tee sheet</a></p>';return}MEMBER=true;GROUP=snap.val();G.style.display='none';listen();draw();seedOpen()}
let PREVIEW=false;
A.onAuthStateChanged(async u=>{if(PREVIEW)return;USER=u;MEMBER=false;GROUP=null;ACCT=null;PRICES={};ACTIVITY={};MY={};if(!u){B.innerHTML='';return signInForm()}G.innerHTML='<p class="ok">Signed in as '+esc(u.email)+'</p>';loadGroup()});
setInterval(()=>{const el=document.getElementById('livephase');if(!el||!GROUP)return;const lines=linesOf(GROUP);const tee=Date.parse(GROUP.teeTime);const past=Number.isFinite(tee)&&Date.now()>=tee;const settled=lines.length&&lines.every(l=>String(l.status||'').toLowerCase()==='settled');el.className='livepill '+(settled?'final':past?'locked':'open');el.textContent=settled?'Final':past?'On course':(Number.isFinite(tee)?'Tee off in '+count(tee-Date.now()):'Tee time TBD')},1000);
window.renderGroupPreview=function(group){PREVIEW=true;GROUP=group;ACCT={bal:100,granted:true,n:'Member'};USER={uid:'preview',email:'member@example.com'};MEMBER=true;G.style.display='none';draw()};
</script></body></html>
