<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Colonial Tee Sheet · Torii Golf Prediction Platform</title>

<h1>Colonial Country Club</h1>

</div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const CLUB='colonial';
firebase.initializeApp({apiKey:'AIzaSyALDF-z2uZONruRz2EXbJAfWKHnW4FS5qA',authDomain:'thirstyfrog-e2aed.firebaseapp.com',databaseURL:'https://thirstyfrog-e2aed-default-rtdb.firebaseio.com',projectId:'thirstyfrog-e2aed',appId:'1:656084503103:web:aca5e6473fd2b920ec868a'});
const A=firebase.auth(),D=firebase.database(),G=document.getElementById('gate'),S=document.getElementById('sheet');
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function signInForm(){G.innerHTML='<p class="kicker">Members</p><h2>Sign in with your Torii account</h2><p class="muted">Same login as the Torii hub. New here? <a href="../../hub/">Join on the hub</a> first.</p><label>Email<input id="em" type="email" placeholder="Email" autocomplete="email"></label><label>Password<input id="pw" type="password" placeholder="Torii password" autocomplete="current-password"></label><button onclick="si()">Sign in</button><p id="m" class="err"></p>'}
async function si(){try{await A.signInWithEmailAndPassword(document.getElementById('em').value.trim(),document.getElementById('pw').value)}catch(x){document.getElementById('m').textContent='Sign-in failed. Check your email and password.'}}
function clubForm(){G.innerHTML='<p class="kicker">Members</p><h2>Colonial members password</h2><p class="muted">Enter the club password once. It unlocks this board for your account.</p><label>Club password<input id="cp" type="password" placeholder="Club password" autocomplete="off"></label><div class="actions"><button onclick="unlock()">Unlock</button><a href="#" onclick="A.signOut();return false">Sign out</a></div><p id="m" class="err"></p>'}
async function unlock(){const v=document.getElementById('cp').value.trim();try{await D.ref('golf_members/'+CLUB+'/'+A.currentUser.uid).set(v);load()}catch(x){document.getElementById('m').textContent='Wrong club password.'}}
// Group at golf/<club>/sheets/<day>/groups/<id> (or golf/<club>/groups/<id>):
//   teeTime: ISO-8601 with a numeric offset, wall time in America/Chicago
//   players: [{name, handicapIndex}]
//   lines: 3 or 4 of {kind, title, status: "open"|"closed"|"settled", result, ...}
//     moneyline — low net, outcomes[{name, odds}]
//     ou — best gross, or one player's net: line, over, under
//     h2h — outcomes[{name, odds}]
// An open line displays as closed once teeTime passes. An admin sets status "settled" and result from posted GHIN scores.
function chicagoFields(date){const parts={};new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',timeZoneName:'longOffset'}).formatToParts(date).forEach(p=>{parts[p.type]=p.value});if(parts.hour==='24')parts.hour='00';return parts}
function chicagoOffset(date){const m=String(chicagoFields(date).timeZoneName||'').match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);return m?m[1]+m[2].padStart(2,'0')+':'+(m[3]||'00'):'-06:00'}
function nextChicagoMorning(){const now=chicagoFields(new Date()),base=new Date(Date.UTC(+now.year,+now.month-1,+now.day+1)),day=base.getUTCFullYear()+'-'+String(base.getUTCMonth()+1).padStart(2,'0')+'-'+String(base.getUTCDate()).padStart(2,'0');let iso=day+'T08:00:00-06:00';for(let i=0;i<2;i++){const next=day+'T08:00:00'+chicagoOffset(new Date(Date.parse(iso)));if(next===iso)break;iso=next}return iso}
function fmtLeft(ms){let s=Math.max(0,Math.floor(ms/1000));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;const p=n=>String(n).padStart(2,'0');return d+'d '+p(h)+'h '+p(m)+'m '+p(s)+'s'}
function phaseNow(settled,teeMs){if(settled)return {kind:'final',text:'Final'};if(!Number.isFinite(teeMs))return {kind:'tbd',text:'Tee time TBD'};if(Date.now()<teeMs)return {kind:'count',text:'Tee off in '+fmtLeft(teeMs-Date.now())};return {kind:'oncourse',text:'On course'}}
function shownStatus(stored,teeMs){const s=String(stored||'open').toLowerCase();if(s==='settled')return 'settled';if(s==='closed'||(Number.isFinite(teeMs)&&Date.now()>=teeMs))return 'closed';return 'open'}
function statusWord(s){return s==='settled'?'Settled':s==='closed'?'Closed':'Open'}
function fmtIndex(v){if(v==null||v==='')return '—';const n=Number(v);return Number.isFinite(n)?(Math.round(n*10)/10).toFixed(1):String(v)}
function fmtOdds(o){if(o==null||o==='')return '—';if(typeof o==='number')return (o>0?'+':'')+o;return String(o)}
function resultText(line){const r=line.result;if(r==null||r==='')return '';if(typeof r==='string')return r;if(typeof r==='object')return r.label||r.name||r.side||r.outcome||'';return String(r)}
function teeOf(g){return g.teeTime||g.tee_time||''}
function playersOf(g){return (g.players||[]).map(p=>({name:p.name||'Player',handicapIndex:p.handicapIndex!=null?p.handicapIndex:(p.handicap!=null?p.handicap:p.hcp)}))}
function linesOf(g){if(Array.isArray(g.lines)&&g.lines.length)return g.lines;const ps=g.players||[],out=[];if(ps.some(p=>p.win!=null&&p.win!==''&&p.win!=='—'))out.push({kind:'moneyline',title:'Low net in the group',status:g.status||'open',result:g.result==null?null:g.result,outcomes:ps.map(p=>({name:p.name,odds:p.win}))});const p0=ps.find(p=>p.ou!=null&&p.ou!==''&&p.ou!=='—');if(p0)out.push({kind:'ou',title:(p0.name||'Player')+' net score',status:g.status||'open',result:null,player:p0.name,line:p0.ou,over:p0.over,under:p0.under});return out}
function fmtTee(iso){const t=Date.parse(iso);if(!Number.isFinite(t))return String(iso||'');return new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date(t))}
function oddsHTML(line){const kind=String(line.kind||'').toLowerCase(),outs=Array.isArray(line.outcomes)?line.outcomes:(Array.isArray(line.odds)?line.odds:null);if(kind==='ou'||((line.over!=null||line.under!=null)&&!outs)){const n=line.line==null?'':line.line;return '<span class="odd">Over '+e(n)+' · '+e(fmtOdds(line.over))+'</span><span class="odd">Under '+e(n)+' · '+e(fmtOdds(line.under))+'</span>'}if(outs)return outs.map(o=>'<span class="odd">'+e(o.name||o.player||'')+' '+e(fmtOdds(o.odds!=null?o.odds:o.price))+'</span>').join('');return ''}
function sampleGroup(){return {teeTime:nextChicagoMorning(),tee:'Sample',players:[{name:'Sample Player A',handicapIndex:8.2},{name:'Sample Player B',handicapIndex:12.4},{name:'Sample Player C',handicapIndex:3.1},{name:'Sample Player D',handicapIndex:18.6}],lines:[{kind:'moneyline',title:'Low net in the group',status:'open',result:null,outcomes:[{name:'Sample Player A',odds:'+150'},{name:'Sample Player B',odds:'+180'},{name:'Sample Player C',odds:'-110'},{name:'Sample Player D',odds:'+220'}]},{kind:'ou',title:'Best gross score',status:'open',result:null,line:74.5,over:'-115',under:'-105'},{kind:'ou',title:'Sample Player A net score',status:'open',result:null,player:'Sample Player A',line:36.5,over:'-110',under:'-110'}]}}
function lineHTML(line,teeIso){const teeMs=Date.parse(teeIso),stored=String(line.status||'open').toLowerCase(),eff=shownStatus(stored,teeMs),res=stored==='settled'?resultText(line):'';return '<div class="line" data-status="'+e(stored)+'" data-tee="'+e(teeIso)+'"><div class="top"><span>'+e(line.title||'Line')+'</span><span class="st '+eff+'">'+statusWord(eff)+'</span></div>'+(res?'<div class="res">Result · '+e(res)+'</div>':'')+'<div class="outs">'+oddsHTML(line)+'</div></div>'}
function grpHTML(g,sample){const teeIso=teeOf(g),teeMs=Date.parse(teeIso),players=playersOf(g),all=linesOf(g),lines=all.slice(0,4),settled=all.length>0&&all.every(l=>String(l.status||'').toLowerCase()==='settled'),phase=phaseNow(settled,teeMs),when=Number.isFinite(teeMs)?fmtTee(teeIso):(teeIso||'Tee time');return '<div class="grp'+(sample?' sample':'')+'">'+(sample?'<div class="lbl">SAMPLE DATA · layout preview only, not a real group</div>':'')+'<div class="head"><div class="tt">'+e(when)+(g.tee?' <span class="muted">· '+e(g.tee)+' tee</span>':'')+'</div><div class="phase '+phase.kind+'" data-tee="'+e(teeIso)+'" data-settled="'+(settled?'1':'0')+'">'+e(phase.text)+'</div></div><div class="players">'+players.map(p=>'<span>'+e(p.name)+' · Index '+e(fmtIndex(p.handicapIndex))+'</span>').join('')+'</div>'+lines.map(l=>lineHTML(l,teeIso)).join('')+(all.length>4?'<p class="muted">Showing 4 of '+all.length+' lines.</p>':'')+'</div>'}
function sortGroups(gs){return gs.slice().sort((a,b)=>{const ta=Date.parse(teeOf(a))||0,tb=Date.parse(teeOf(b))||0;if(ta&&tb)return ta-tb;return String(teeOf(a)||a.time||'').localeCompare(String(teeOf(b)||b.time||''))})}
function groupList(d){if(!d)return {day:'',groups:[]};if(d.sheets&&Object.keys(d.sheets).length){const day=Object.keys(d.sheets).sort().pop(),gs=(d.sheets[day]&&d.sheets[day].groups)?Object.values(d.sheets[day].groups):[];return {day,groups:sortGroups(gs)}}if(d.groups)return {day:'',groups:sortGroups(Object.values(d.groups))};return {day:'',groups:[]}}
function tickSheet(){document.querySelectorAll('.phase').forEach(el=>{const phase=phaseNow(el.dataset.settled==='1',Date.parse(el.dataset.tee||''));el.className='phase '+phase.kind;if(el.textContent!==phase.text)el.textContent=phase.text});document.querySelectorAll('.line').forEach(el=>{const eff=shownStatus(el.dataset.status,Date.parse(el.dataset.tee||'')),pill=el.querySelector('.st');if(!pill)return;const word=statusWord(eff);pill.className='st '+eff;if(pill.textContent!==word)pill.textContent=word})}
async function load(){const u=A.currentUser;let d;try{d=(await D.ref('golf/'+CLUB).once('value')).val()}catch(x){return clubForm()}
 G.innerHTML='<p class="ok">Unlocked as '+e(u.email)+' · <a href="#" onclick="A.signOut();return false">Sign out</a></p>';
 const pack=groupList(d),body=pack.groups.length?pack.groups.map(g=>grpHTML(g)).join(''):grpHTML(sampleGroup(),true);
 S.innerHTML='<section class="sheet"><h2>'+(pack.day?e(pack.day):'No tee sheet posted yet')+'</h2><p class="muted">Tee times in America/Chicago. Each group has 3 or 4 lines: low net, best gross, and a player net or a head-to-head. Lines lock at tee time. An admin settles them from posted GHIN scores.</p>'+body+'</section>';tickSheet()}
A.onAuthStateChanged(u=>{S.innerHTML='';u?load():signInForm()});
setInterval(tickSheet,1000);
</script></body></html>
