<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Club Tee Sheets · Torii Prediction Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter,sans-serif;background:#f6f3ec;color:#14213d}.wrap{max-width:980px;margin:0 auto;padding:16px}header{background:#14213d;color:#fff}header a{color:#fff;text-decoration:none;font:700 20px Oswald,sans-serif}h1{font:700 34px Oswald,sans-serif;margin:18px 0 4px}.sub{color:#555;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.club{position:relative;display:block;border-radius:16px;overflow:hidden;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));aspect-ratio:1/1;box-shadow:0 4px 14px rgba(0,0,0,.15);transition:transform .15s}.club:hover{transform:translateY(-3px)}
.logo{position:absolute;inset:0;display:grid;place-items:center;padding:18px}.logo img{max-width:80%;max-height:50%;object-fit:contain;margin-bottom:30px}.logo img.plate{background:rgba(255,255,255,.94);padding:12px;border-radius:12px}.tile{text-align:center}.tile b{display:block;font:700 30px/1 Oswald,sans-serif;letter-spacing:.04em;text-transform:uppercase}.tile i{display:block;margin-top:8px;font-style:normal;font-size:12px;letter-spacing:.25em;opacity:.85;text-transform:uppercase}
.foot{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:rgba(0,0,0,.35);font-size:13px;display:flex;justify-content:space-between}.badge{font-weight:800}.soon{filter:grayscale(.55);cursor:default}.soon:hover{transform:none}</style></head><body>
<header><div class="wrap"><a href="../hub/">Torii Prediction Platform</a></div></header>
<main class="wrap"><h1>Club Tee Sheets</h1><p class="sub">Pick your club. Every round on the day's tee sheet gets simple odds. Free Torii tokens only, no cash value.</p><div class="grid" id="g">Loading…</div></main>
<script>const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('clubs.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('g').innerHTML=d.clubs.map(c=>{const live=c.status==='live',art=c.logo?'<img class="'+(c.plate?"plate":"")+'" src="'+e(c.logo)+'" alt="'+e(c.full)+'">':'<div class="tile"><b>'+e(c.name)+'</b><i>'+e(c.city)+'</i></div>';return (live?'<a class="club" href="'+e(c.slug)+'/"':'<div class="club soon" aria-disabled="true"')+' style="--c1:'+e(c.c1)+';--c2:'+e(c.c2)+'"><div class="logo">'+art+'</div><div class="foot"><span>'+e(c.full)+'</span><span class="badge">'+(live?'🔒 Members →':'Coming soon')+'</span></div>'+(live?'</a>':'</div>')}).join('')});</script></body></html>
