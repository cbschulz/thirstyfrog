<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Club Tee Sheets · Torii Golf Prediction Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="club.css">
</head><body>
<header class="mast"><div class="wrap mast-in"><a class="brand" href="../hub/"><svg class="gate" viewBox="0 0 100 86" role="img" aria-label="Torii gate"><path fill="currentColor" d="M2 6 Q50 14 98 6 L96 15 Q50 21 4 15Z"/><rect fill="currentColor" x="10" y="19" width="80" height="6"/><rect fill="currentColor" x="46" y="25" width="8" height="11"/><rect fill="currentColor" x="13" y="31" width="74" height="6"/><path fill="currentColor" d="M22 19h9l2 61h-13z"/><path fill="currentColor" d="M69 19h9l2 61h-13z"/><rect fill="currentColor" x="17" y="78" width="19" height="6"/><rect fill="currentColor" x="64" y="78" width="19" height="6"/></svg><span class="wm"><strong>Torii</strong><em>Golf Prediction Platform</em></span></a><a class="toplink" href="../hub/">All boards</a></div></header>
<main class="page"><div class="wrap">
<p class="eyebrow">Members' clubs</p>
<h1>Club Tee Sheets</h1>
<div class="rule"></div>
<p class="lede">Pick your club. Every round on the day's tee sheet gets simple odds. Free Torii tokens only, no cash value.</p>
<div class="grid" id="g">Loading…</div>
</div></main>
<script>const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('clubs.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('g').innerHTML=d.clubs.map(c=>{const live=c.status==='live',well=c.plate?'#fbf8f2':(c.c1||'#0e1c2f'),art=c.logo?'<img class="'+(c.plate?'plate':'')+'" src="'+e(c.logo)+'" alt="'+e(c.full)+'">':'<div class="tile"><b>'+e(c.name)+'</b><i>'+e(c.city)+'</i></div>';return (live?'<a class="club" href="'+e(c.slug)+'/"':'<div class="club soon" aria-disabled="true"')+' style="--accent:'+e(c.c1||'#a68545')+'"><div class="well" style="background:'+e(well)+'">'+art+'</div><div class="meta"><h2>'+e(c.full)+'</h2><p>'+e(c.city)+'</p></div><span class="badge">'+(live?'Members →':'Coming soon')+'</span>'+(live?'</a>':'</div>')}).join('')});</script>
</body></html>
